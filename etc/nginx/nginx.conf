
worker_processes 5;

events {
  worker_connections  4096;  ## Default: 1024
}

http {
  include    mime.types;
  include    proxy.conf;

  default_type application/octet-stream;

  upstream api {
    server api:8000;
  }

  server {
    listen 80;

    location /watcher {
    	include    uwsgi_params;
      uwsgi_pass api;
      rewrite ^/watcher(/.*)$ $1 break;
    }

    location / {
      root /data/video/watcher;
      expires 30d;
      add_header Cache-Control "public, immutable";
      sendfile on;
      tcp_nopush on;
      open_file_cache max=1000 inactive=20s;
    }

  }
}
