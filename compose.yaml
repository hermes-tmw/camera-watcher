services:
  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    volumes:
      - ./etc:/usr/local/etc:ro
    restart: always

  motion:
    build:
      dockerfile: Dockerfile-motion
    command: motion -n
    user: "0:44"
    depends_on:
      - redis
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
    environment:
      - REDIS_URL=redis://redis
    restart: always

  io:
    build:
      context: .
      dockerfile: Dockerfile-io
      args:
        GIT_VERSION: ${GIT_VERSION:-}
    # Pin the image tag: Dockerfile-video does `FROM camera-watcher-io`, so the
    # tag must exist regardless of the compose project (directory) name.
    image: camera-watcher-io
    command: ./watchutil.py ioworker
    user: "0:44"
    depends_on:
      - redis
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
    environment:
      - WATCHER_CONFIG=/usr/local/etc/watcher.cfg
      - WATCHER_LOG_FILE=/var/log/watcher/ioworker.log
    restart: always

  video:
    build:
      context: .
      dockerfile: Dockerfile-video
      args:
        GIT_VERSION: ${GIT_VERSION:-}
    command: ./watchutil.py videoworker
    user: "0:44"
    depends_on:
      - redis
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
    environment:
      - WATCHER_CONFIG=/usr/local/etc/watcher.cfg
      - WATCHER_LOG_FILE=/var/log/watcher/videoworker.log
    restart: always

  classifier:
    profiles: ["predictor", "all"]
    build:
      context: .
      dockerfile: Dockerfile-classifier
      args:
        GIT_VERSION: ${GIT_VERSION:-}
    command: ./watchutil.py classifyworker
    user: "0:44"
    depends_on:
      - redis
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WATCHER_CONFIG=/usr/local/etc/watcher.cfg
      - WATCHER_LOG_FILE=/var/log/watcher/classifier.log
      - WATCHER_CLASSIFICATION_OLLAMA_HOST=http://host.docker.internal:11434
      - WATCHER_CLASSIFICATION_YOLO_WEIGHTS=/data/video/watcher/stealthcam/yolo11n.pt
      - ULTRALYTICS_SAFE_LOAD=1
    restart: always

  stealthcam:
    profiles: ["all"]
    build:
      context: .
      dockerfile: Dockerfile-stealthcam
      args:
        GIT_VERSION: ${GIT_VERSION:-}
    command: python -m stealthcam.worker
    user: "0:44"
    depends_on:
      - redis
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
      - /home/claw/.hermes/secrets/stealthcam.json:/secrets/stealthcam.json:ro
      - /home/claw/.hermes/secrets/mattermost_persona_tokens.json:/secrets/mattermost_persona_tokens.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WATCHER_CONFIG=/usr/local/etc/watcher.cfg
      - WATCHER_LOG_FILE=/var/log/watcher/stealthcam.log
      - STEALTHCAM_SECRETS_STEALTHCAM=/secrets/stealthcam.json
      - STEALTHCAM_SECRETS_MATTERMOST=/secrets/mattermost_persona_tokens.json
      - STEALTHCAM_MATTERMOST_BASE_URL=http://mira:8065
      - STEALTHCAM_MATTERMOST_CHANNEL_ID=n7c5ooyjabb4dje5d81e9y5spw
      - STEALTHCAM_MATTERMOST_BOT=cody
      - STEALTHCAM_PIPELINE_DB=/data/video/watcher/stealthcam/stealthcam.db
      - STEALTHCAM_SUBIMAGE_DIR=/data/video/watcher/stealthcam
      - STEALTHCAM_DETECTOR_WEIGHTS=/data/video/watcher/stealthcam/yolo11n.pt
      - STEALTHCAM_DETECTOR_DEVICE=cpu
      - STEALTHCAM_DESCRIBER_OLLAMA_HOST=http://host.docker.internal:11434
      - STEALTHCAM_DESCRIBER_MODEL=qwen2.5vl:latest
      - STEALTHCAM_DIRECTION_REGIONS=west=driveway
    restart: always

  # Wichita house — motion-event ingestor feeding entity-memory scope=wichita.
  # SAME image as stealthcam (shared engine); different entrypoint + config.
  # Scope isolation is structural (Memory scope param + scope-keyed tables);
  # the shared SQLite DB runs WAL (set by Memory on open) so the two scope
  # writers on this host don't lock each other out.
  wichita:
    profiles: ["wichita", "all"]
    build:
      context: .
      dockerfile: Dockerfile-stealthcam
      args:
        GIT_VERSION: ${GIT_VERSION:-}
    command: python -m stealthcam.motion_ingest
    user: "0:44"
    depends_on:
      - redis
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
      - /home/claw/.hermes/secrets/mattermost_persona_tokens.json:/secrets/mattermost_persona_tokens.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WATCHER_CONFIG=/usr/local/etc/watcher.cfg
      - WATCHER_LOG_FILE=/var/log/watcher/wichita.log
      - STEALTHCAM_SECRETS_MATTERMOST=/secrets/mattermost_persona_tokens.json
      - STEALTHCAM_MATTERMOST_BASE_URL=http://mira:8065
      - STEALTHCAM_MATTERMOST_CHANNEL_ID=n7c5ooyjabb4dje5d81e9y5spw
      - STEALTHCAM_MATTERMOST_BOT=cody
      - STEALTHCAM_PIPELINE_DB=/data/video/watcher/stealthcam/stealthcam.db
      - STEALTHCAM_SUBIMAGE_DIR=/data/video/watcher/stealthcam
      - STEALTHCAM_DETECTOR_WEIGHTS=/data/video/watcher/stealthcam/yolo11n.pt
      - STEALTHCAM_DETECTOR_DEVICE=cpu
      - STEALTHCAM_DESCRIBER_OLLAMA_HOST=http://host.docker.internal:11434
      - STEALTHCAM_DESCRIBER_MODEL=qwen2.5vl:latest
      - STEALTHCAM_MEMORY_SCOPE=wichita
      - STEALTHCAM_SCOPES={"wichita":{"event_scenes":["WichitaDriveway"],"detector_conf_threshold":0.45,"event_poll_seconds":300,"event_backlog_max":200,"road_band_y_max":0.42,"road_band_x_min":0.30,"road_band_x_max":0.52}}
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile-api
      args:
        GIT_VERSION: ${GIT_VERSION:-}
    profiles: ["web", "all"]
    user: "0:44"
    command: uwsgi --ini /usr/local/etc/uwsgi.ini
    volumes:
      - /data/video:/data/video
      - ./etc:/usr/local/etc:ro
      - ./log:/var/log
    environment:
      - WATCHER_CONFIG=/usr/local/etc/watcher.cfg
      - WATCHER_LOG_FILE=/var/log/watcher/api.log
    restart: always

  web:
    image: nginx
    profiles: ["web", "all"]
    volumes:
     - /data/video:/data/video:ro
     - ./etc/nginx:/etc/nginx:ro
    ports:
     - "80:80"
    environment:
     - NGINX_HOST=mira.local
     - NGINX_PORT=80
    restart: always
